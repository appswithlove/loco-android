name: Build

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        steps:
        - uses: actions/checkout@v3
        - name: set up JDK 21
          uses: actions/setup-java@v3
          with:
              java-version: '21'
              distribution: 'temurin'
              cache: gradle

        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
        - name: Build with Gradle
          run: ./gradlew build

        - name: Run integration tests
          run: ./gradlew :lib:integrationTest

        - name: Publish test results
          if: always()
          uses: EnricoMi/publish-unit-test-result-action@v2
          with:
              files: lib/build/test-results/**/*.xml

        - name: Upload test results
          if: always()
          uses: actions/upload-artifact@v4
          with:
              name: test-results
              path: |
                  lib/build/reports/tests/test/
                  lib/build/reports/tests/integrationTest/

        - name: Validate Maven Central publishing setup
          run: ./gradlew :lib:publishToMavenLocal --dry-run

        - name: Validate Gradle Plugin Portal publishing setup
          continue-on-error: ${{ github.base_ref != 'production' && github.ref_name != 'production' }}
          run: ./gradlew :lib:publishPlugins --validate-only
          env:
            GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
            GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
            ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
